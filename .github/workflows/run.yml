name: Daily Myanmar News Digest

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Check connections without publishing (uses Gemini API)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: myanmar-publishing
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install --requirement requirements.txt
      - name: Run both languages
        id: post
        env:
          DIAGNOSE: ${{ inputs.diagnose }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_FALLBACK_MODEL: gemini-2.5-flash-lite
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_BLOG_ID_EN: ${{ secrets.HATENA_BLOG_ID_EN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        shell: bash
        run: |
          args=()
          if [[ "$DIAGNOSE" == "true" ]]; then args+=(--diagnose); fi
          status=0
          for lang in ja en; do
            if python main.py --lang "$lang" "${args[@]}"; then
              echo "$lang: completed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$lang: failed; inspect logs" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          done
          exit "$status"
      - name: Save successful posts
        if: ${{ !cancelled() && steps.post.outcome != 'skipped' && inputs.diagnose != true }}
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add seen_articles.json seen_articles_en.json
          if git diff --cached --quiet; then
            echo "No seen-article change."
          else
            git commit -m "Update seen_articles.json (ja/en)"
            git push
          fi
