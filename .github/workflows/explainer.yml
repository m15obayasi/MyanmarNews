name: Daily Myanmar Explainer

on:
  schedule:
    # 10:15 JST. GitHub schedules use UTC and may start a little late.
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate without publishing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: myanmar-publishing
  cancel-in-progress: false

jobs:
  publish-explainer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install --requirement requirements.txt
      - name: Generate source-grounded explainer
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        shell: bash
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python explainer.py "${args[@]}"
      - name: Save published topic history
        if: ${{ !cancelled() && inputs.dry_run != true }}
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add explainer_topics.json
          if git diff --cached --quiet; then
            echo "No topic history change."
          else
            git commit -m "Record published explainer topic"
            git push
          fi
